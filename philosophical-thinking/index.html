<body><main><header class="top"><div class="crumb"><a href="../">首页</a> · 喃喃自语</div><div class="switch"><strong>中文</strong>&nbsp;·&nbsp;<a href="./en/">English</a></div></header><section class="feed" aria-label="随想时间线"><div class="day"><div class="day-label"><strong>31</strong>2026 / 08<br>星期一</div><div class="entries"><article class="mutter"><time datetime="2026-08-31T22:15">22:15</time><p>AI 可以帮助我更快地完成任务，但是其间所需要的思考、理解与判断，一步也省不了。</p></article><article class="mutter"><time datetime="2026-08-31T21:40">21:40</time><p>AI 大幅拓宽了思考的带宽，但人的理解带宽并未同步增长。任务推进得更快了，需要消化、判断和承担的认知负荷却没有减少。</p></article><article class="mutter"><time datetime="2026-08-31T21:18">21:18</time><p>理解与思考本就密不可分。一旦在思考上借 AI 偷了懒，我们建立在 AI 梳理结果之上的理解，往往也会随之变浅。</p></article><article class="mutter"><time datetime="2026-08-31T20:56">20:56</time><p>“你可以外包思考，但无法外包理解。”</p></article></div></div></section></main></body>
